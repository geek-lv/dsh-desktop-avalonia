<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness Desktop</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #151517; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font: 13px/1.4 "Segoe UI", "Microsoft YaHei UI", -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    color: #cfd3d6; user-select: none; -webkit-user-select: none;
    background:
      radial-gradient(52% 44% at 50% 40%, rgba(77,107,254,.12), transparent 72%),
      #151517;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 13px; }

  .halo { position: relative; width: 158px; height: 170px; display: grid; place-items: center; }
  .halo::before {
    content: ''; position: absolute; inset: 6px 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(77,107,254,.34), rgba(34,211,238,.14) 55%, transparent 72%);
    filter: blur(9px); animation: breathe 3.6s ease-in-out infinite;
  }
  .halo img {
    position: relative; width: 136px; height: auto; -webkit-user-drag: none;
    animation: float 3.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.42));
  }
  .halo img.sorry { width: 128px; }
  @keyframes float { 0%,100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
  @keyframes breathe { 0%,100% { opacity: .48; } 50% { opacity: 1; } }

  .title { font-size: 14px; font-weight: 600; letter-spacing: .35px; color: #e6e8ea; }
  .bar {
    width: 148px; height: 3px; border-radius: 3px; overflow: hidden; position: relative;
    background: rgba(255,255,255,.085);
  }
  .bar::after {
    content: ''; position: absolute; top: 0; left: -42%; width: 42%; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #4d6bfe, #22d3ee);
    animation: slide 1.25s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes slide { 0% { left: -42%; } 100% { left: 100%; } }

  .status { font-size: 12px; color: #9aa0a6; min-height: 17px; text-align: center; padding: 0 26px; }
  .err { display: none; }
  .err button {
    all: unset; cursor: default; padding: 6px 15px; border-radius: 6px; font-size: 12px;
    background: rgba(255,255,255,.10); color: #e8eaed; transition: background-color 110ms ease;
  }
  .err button:hover { background: rgba(255,255,255,.18); }
  .err button:active { background: rgba(255,255,255,.24); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="halo"><img id="hero" src="splash-whale-idle.webp" alt=""></div>
    <div class="title">DeepSeek Harness Desktop</div>
    <div class="bar" id="bar"></div>
    <div class="status" id="status">{{STARTING}}</div>
    <div class="err" id="err"><button id="retry">{{RETRY}}</button></div>
  </div>
<script>
  var IDLE = 'splash-whale-idle.webp';
  var SORRY = 'splash-whale-sorry.webp';

  window.__dshSplash = function (text, failed) {
    var status = document.getElementById('status');
    var bar = document.getElementById('bar');
    var err = document.getElementById('err');
    var hero = document.getElementById('hero');
    if (status && typeof text === 'string') status.textContent = text;
    if (bar) bar.style.display = failed ? 'none' : 'block';
    if (err) err.style.display = failed ? 'block' : 'none';
    if (hero) {
      var want = failed ? SORRY : IDLE;
      if (hero.getAttribute('src') !== want) {
        hero.setAttribute('src', want);
        hero.classList.toggle('sorry', !!failed);
      }
    }
  };

  document.getElementById('retry').addEventListener('click', function () {
    window.__dshSplash('{{RESTARTING}}', false);
    try { if (window.invokeCSharpAction) { window.invokeCSharpAction('retry'); return; } } catch (e) {}
    try { window.chrome.webview.postMessage('retry'); } catch (e) {}
  });
</script>
</body>
</html>
